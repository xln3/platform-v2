[project]
name = "geo-platform-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "cryptography==45.0.5",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "temporalio==1.15.0",
  "uvicorn[standard]==0.35.0",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "pyjwt[crypto]==2.13.0",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "python-multipart==0.0.20",
  "playwright==1.61.0",
  "pillow==12.3.0",
  "onnxruntime==1.28.0",
  "rapidocr==3.9.2",
  "python-docx==1.2.0",
  "lxml==6.1.1",
  "reportlab==5.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/geo_platform", "domain", "workflows"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "isolated_postgres: requires an owner-controlled PostgreSQL database at the current migration head",
  "knowledge_postgres: requires a dedicated knowledge-governance PostgreSQL database at the current migration head",
  "compat_postgres: requires an owner-controlled PostgreSQL database pinned to a historical migration",
  "external_fixture: requires reviewed source material that is intentionally stored outside this repository",
  "document_toolchain: requires the LibreOffice document-rendering toolchain",
  "slow: high-volume or restart/recovery coverage kept out of the local fast feedback loop",
  "service_integration: requires repository-managed infrastructure such as Temporal",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["geo_platform", "domain", "workflows"]
mypy_path = ["api", "."]

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

# patchright 是生产浏览器驱动（worker 部署环境单独安装），不在 .[dev] 依赖内——
# CI/开发 venv 没有它，browser_driver 内的惰性 import 会报 import-not-found；按 reportlab 先例豁免。
[[tool.mypy.overrides]]
module = "patchright.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
