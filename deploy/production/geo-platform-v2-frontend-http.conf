# Public backend selected by all browser-facing edge listeners.  The current
# single-host deployment deliberately traverses the machine's public IP.  When
# the backend moves to another machine, change only this upstream address.
upstream geo_platform_v2_backend_public {
    server 39.105.175.14:8443;
    keepalive 64;
}

# Query strings may contain customer data or setup material.  Edge logs record
# only the normalized path and request timings.
log_format geo_frontend_edge '$time_iso8601 request_id=$request_id '
                             'remote_addr=$remote_addr method=$request_method '
                             'uri=$uri status=$status request_time=$request_time '
                             'upstream_time=$upstream_response_time';
