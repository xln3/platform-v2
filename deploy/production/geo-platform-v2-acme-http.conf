# HTTP is exposed only for ACME HTTP-01 ownership validation. GEO application
# traffic remains HTTPS-only on 8443; all non-challenge requests fail closed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 39.105.175.14;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
