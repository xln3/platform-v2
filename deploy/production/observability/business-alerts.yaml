groups:
  - name: geo-platform-availability
    rules:
      - alert: GeoPlatformV2ApiDown
        expr: up{job="geo-platform-v2-api"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          service: api
        annotations:
          summary: GEO Platform V2 API target is unavailable
      - alert: GeoBusinessMetricsExporterDown
        expr: up{job="geo-platform-v2-business-metrics"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          service: business-metrics
        annotations:
          summary: GEO business metrics exporter is unavailable
      - alert: GeoBusinessMetricsCollectionFailed
        expr: geo_business_metrics_collection_success == 0
        for: 2m
        labels:
          severity: critical
          category: observability
          service: business-metrics
        annotations:
          summary: GEO business metrics cannot read authoritative state
      - alert: GeoApiServerErrorRateHigh
        expr: sum(rate(geo_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          category: api
          service: api
        annotations:
          summary: GEO API server error rate is elevated
      - alert: GeoApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(geo_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
          category: api
          service: api
        annotations:
          summary: GEO API p95 latency exceeds two seconds

  - name: geo-platform-business-state
    rules:
      - alert: GeoWorkflowStartBacklogStale
        expr: geo_business_workflow_start_stale > 0
        for: 5m
        labels:
          severity: critical
          category: workflow
          service: outbox-worker
        annotations:
          summary: Workflow start commands are stale
      - alert: GeoWorkflowSignalBacklogStale
        expr: geo_business_workflow_signal_stale > 0
        for: 5m
        labels:
          severity: critical
          category: workflow
          service: outbox-worker
        annotations:
          summary: Workflow signal commands are stale
      - alert: GeoCollectionRunStalled
        expr: geo_business_collection_run_stalled > 0
        for: 5m
        labels:
          severity: warning
          category: collection
          service: collection-worker
        annotations:
          summary: Collection runs have not changed for one hour
      - alert: GeoRevocationStalled
        expr: geo_business_revocation_stalled > 0
        for: 2m
        labels:
          severity: critical
          category: custody
          service: collection-worker
        annotations:
          summary: Account revocation requests are stalled
      - alert: GeoExpiredSessionLease
        expr: geo_business_expired_session_leases > 0
        for: 2m
        labels:
          severity: critical
          category: custody
          service: collection-worker
        annotations:
          summary: Expired session leases remain authoritative
      - alert: GeoCollectionAnalysisAdmissionBlocked
        expr: sum(geo_business_collection_analysis_admission_backlog) > 0
        for: 1m
        labels:
          severity: warning
          category: analysis
          service: s02-worker
        annotations:
          summary: Completed collections await analysis admission
      - alert: GeoAnalyticsOutboxBacklog
        expr: sum(geo_business_analytics_outbox_backlog) > 0
        for: 5m
        labels:
          severity: warning
          category: analysis
          service: outbox-worker
        annotations:
          summary: Analytics outbox events are not being projected
      - alert: GeoAnalyticsOutboxQuarantined
        expr: sum(geo_business_analytics_outbox_quarantined) > 0
        for: 2m
        labels:
          severity: critical
          category: analysis
          service: outbox-worker
        annotations:
          summary: Poisoned analytics outbox events are quarantined and await manual recovery
      - alert: GeoReportDeliveryConfirmationOverdue
        expr: geo_business_report_delivery_confirmation_overdue > 0
        for: 15m
        labels:
          severity: warning
          category: reporting
          service: api
        annotations:
          summary: Published report delivery confirmation is overdue

  - name: geo-platform-query-cohort-metrics-v2
    rules:
      - alert: GeoMetricsV2OutboxBacklog
        expr: geo_metrics_v2_outbox_backlog > 0
        for: 10m
        labels:
          severity: warning
          category: metrics-v2
          service: metrics-worker
        annotations:
          summary: V2 metrics workflow commands remain queued
      - alert: GeoMetricsV2EvaluationLag
        expr: geo_metrics_v2_evaluation_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
          category: metrics-v2
          service: metrics-worker
        annotations:
          summary: V2 metric evaluation latency exceeds the operating target
      - alert: GeoMetricsV2HashMismatch
        expr: geo_metrics_v2_hash_mismatch_total > 0
        for: 0m
        labels:
          severity: critical
          category: integrity
          service: metrics-worker
        annotations:
          summary: V2 metric hash or reconciliation mismatch was detected
      - alert: GeoMetricsV2CoverageBelowGate
        expr: (geo_metrics_v2_collection_coverage < 0.98) or (geo_metrics_v2_semantic_coverage < 0.98)
        for: 5m
        labels:
          severity: critical
          category: integrity
          service: metrics-worker
        annotations:
          summary: V2 collection or semantic coverage is below the publication gate
      - alert: GeoMetricsV2OfficialPointerInvalid
        expr: geo_metrics_v2_official_pointer_invalid > 0
        for: 0m
        labels:
          severity: critical
          category: publication
          service: metrics-worker
        annotations:
          summary: A V2 official pointer does not reference a ready snapshot set
      - alert: GeoSemanticDecisionV2Backlog
        expr: geo_semantic_decision_v2_backlog > 0
        for: 10m
        labels:
          severity: warning
          category: decision-v2
          service: decision-worker
        annotations:
          summary: V2 semantic decisions remain pending or running
      - alert: GeoSemanticDecisionV2QualityGate
        expr: (geo_semantic_decision_v2_abstention_ratio > 0.02) or (geo_semantic_decision_v2_disagreement_ratio > 0.02) or (geo_semantic_decision_v2_evidence_failure_ratio > 0.02)
        for: 5m
        labels:
          severity: critical
          category: decision-v2
          service: decision-worker
        annotations:
          summary: V2 semantic decision quality exceeds an approved error gate
      - alert: GeoSemanticDecisionV2InvalidOutput
        expr: geo_semantic_decision_v2_invalid_output_total > 0
        for: 0m
        labels:
          severity: warning
          category: decision-v2
          service: decision-worker
        annotations:
          summary: A V2 judge returned invalid structured output
      - alert: GeoSemanticDecisionV2FallbackBlocked
        expr: geo_semantic_decision_v2_fallback_blocked_total > 0
        for: 0m
        labels:
          severity: critical
          category: decision-v2
          service: decision-worker
        annotations:
          summary: An uncalibrated semantic fallback attempt was blocked
      - alert: GeoReportV2SnapshotValidationFailed
        expr: geo_report_v2_snapshot_validation_failures_total > 0
        for: 0m
        labels:
          severity: critical
          category: reporting
          service: report-worker
        annotations:
          summary: A formal report failed V2 snapshot binding validation
