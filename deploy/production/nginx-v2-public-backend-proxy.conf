# Include inside an edge location that must reach the API through the public
# HTTPS backend boundary.  Browser-supplied identity headers are stripped here
# and again at the 8443 backend before the request reaches the application.
proxy_pass https://geo_platform_v2_backend_public;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host geo-answer-backend.local;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Tenant-Id "";
proxy_set_header X-Actor-Id "";
proxy_set_header X-Actor-Role "";
proxy_set_header X-Service-Token "";

proxy_ssl_server_name on;
proxy_ssl_name geo-answer-backend.local;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /etc/geo-platform-v2/customer-read-pki/ca.crt;
proxy_ssl_certificate /etc/geo-platform-v2/customer-read-pki/edge.crt;
proxy_ssl_certificate_key /etc/geo-platform-v2/customer-read-pki/edge.key;
proxy_ssl_session_reuse on;

proxy_connect_timeout 3s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
