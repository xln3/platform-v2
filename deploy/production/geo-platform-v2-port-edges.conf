# Browser-facing roles are intentionally split across distinct HTTPS listeners.
# Every API request crosses the public 8443 boundary even while all four roles
# temporarily share one host.

server {
    listen 8787 ssl;
    listen [::]:8787 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/39.105.175.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.105.175.14/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    access_log /var/log/nginx/geo-customer-edge.log geo_frontend_edge;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        return 308 /platform/customer/;
    }
    location = /platform {
        return 308 /platform/customer/;
    }
    location = /platform/customer {
        return 308 /platform/customer/;
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }
    location /platform/customer-terminal-extension/ {
        alias /var/lib/geo-platform-v2/customer-terminal-extension/current/;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ ^/platform/customer/(.+\.mjs)$ {
        alias /opt/geo-platform-v2/current/apps/customer-web/build/client/$1;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /platform/customer/login {
        alias /opt/geo-platform-v2/current/deploy/production/customer-login.html;
        default_type text/html;
        charset utf-8;
        expires -1;
    }
    location = /platform/customer/login/ {
        return 308 /platform/customer/login$is_args$args;
    }
    location = /platform/customer/index.html {
        alias /opt/geo-platform-v2/current/apps/customer-web/build/client/index.html;
        expires -1;
    }
    location /platform/customer/ {
        alias /opt/geo-platform-v2/current/apps/customer-web/build/client/;
        try_files $uri $uri/ /platform/customer/index.html;
    }
    location = /platform/operations/login {
        return 308 /platform/customer/login$is_args$args;
    }
    location = /platform/operations {
        return 308 https://39.105.175.14:8788/platform/operations/;
    }
    location ^~ /platform/operations/ {
        return 308 https://39.105.175.14:8788$request_uri;
    }

    # Answer bodies retain their narrower certificate-pinned mTLS hop.  Other
    # browser APIs use the public CA-verified 8443 backend proxy below.
    include /etc/nginx/snippets/geo-platform-v2-customer-answer-edge.conf;
    location /api/v2/ {
        include /etc/nginx/snippets/geo-platform-v2-public-backend-proxy.conf;
    }
    location / {
        return 404;
    }
}

server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/39.105.175.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.105.175.14/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    access_log /var/log/nginx/geo-configuration-edge.log geo_frontend_edge;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;

    location = / {
        return 308 /api/v2/otp/setup;
    }
    location = /healthz {
        return 308 /api/v2/health;
    }
    location = /api/v2/health {
        include /etc/nginx/snippets/geo-platform-v2-public-backend-proxy.conf;
    }
    # The configuration listener does not mirror the backend's public push
    # webhook. It exposes only the setup UI and endpoints used by that UI.
    location ~ ^/api/v2/otp/(?:setup|setup-info|status|register|latest|apk-info|smsforwarder-license|smsforwarder\.apk)$ {
        include /etc/nginx/snippets/geo-platform-v2-public-backend-proxy.conf;
    }
    location / {
        return 404;
    }
}

server {
    listen 8788 ssl;
    listen [::]:8788 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/39.105.175.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.105.175.14/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    access_log /var/log/nginx/geo-operations-edge.log geo_frontend_edge;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        return 308 /platform/operations/;
    }
    location = /platform/operations {
        return 308 /platform/operations/;
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }
    location = /platform/operations/index.html {
        alias /opt/geo-platform-v2/current/apps/operations-web/build/client/index.html;
        expires -1;
    }
    location /platform/operations/ {
        alias /opt/geo-platform-v2/current/apps/operations-web/build/client/;
        try_files $uri $uri/ /platform/operations/index.html;
    }
    location = /platform/customer {
        return 308 https://39.105.175.14:8787/platform/customer/;
    }
    location ^~ /platform/customer/ {
        return 308 https://39.105.175.14:8787$request_uri;
    }
    location /api/v2/ {
        include /etc/nginx/snippets/geo-platform-v2-public-backend-proxy.conf;
    }
    location / {
        return 404;
    }
}
