[Service]
# GEO targets domestic services by default.  Never inherit the workstation's
# circumvention proxy.  Browser collectors that require a geographic exit use
# explicit GEO_* proxy URLs and Chromium --proxy-server arguments instead.
Environment="HTTP_PROXY="
Environment="HTTPS_PROXY="
Environment="ALL_PROXY="
Environment="NO_PROXY=*"
Environment="http_proxy="
Environment="https_proxy="
Environment="all_proxy="
Environment="no_proxy=*"

# Foreign model traffic has one approved gateway.  Keep primary/fallback equal
# in installed releases whose older code requires a non-empty fallback; newer
# code de-duplicates the endpoint and relies on its outer retry policy.
Environment="GEO_RESEARCH_LLM_BASE_URL=https://api.inferera.com"
Environment="GEO_RESEARCH_LLM_BASE_URL_FALLBACK=https://api.inferera.com"
Environment="GEO_AUDIT_LLM_BASE_URL=https://api.inferera.com"
Environment="GEO_AUDIT_LLM_BASE_URL_FALLBACK=https://api.inferera.com"
Environment="GEO_POST_ANALYSIS_LLM_BASE_URL=https://api.inferera.com"
Environment="GEO_POST_ANALYSIS_LLM_BASE_URL_FALLBACK=https://api.inferera.com"
Environment="GEO_BRANDRANK_LLM_BASE_URL=https://api.inferera.com"
Environment="GEO_BRANDRANK_LLM_BASE_URL_FALLBACK=https://api.inferera.com"
