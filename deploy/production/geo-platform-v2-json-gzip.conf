# Install in /etc/nginx/conf.d (http context). The base nginx configuration
# already enables gzip; these settings include JSON API responses and preserve
# cache correctness for clients that do not advertise compression support.
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json application/problem+json;
