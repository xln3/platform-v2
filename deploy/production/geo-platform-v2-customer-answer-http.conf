# Install in Nginx's http context before the public 8443 server is parsed.
# The current single-host deployment deliberately reaches the machine through
# its public address.  When the customer edge moves, only this upstream changes.
upstream geo_customer_answer_backend_public {
    server 39.105.175.14:8443;
    keepalive 32;
}

# The edge applies this budget to the real browser address before the request
# crosses the public mTLS hop.  No tenant, query text, Cookie, or token is a key.
limit_req_zone $binary_remote_addr zone=geo_customer_answer_read:10m rate=20r/s;

# Query strings can contain customer keywords.  Log only the normalized path.
log_format geo_customer_answer '$time_iso8601 request_id=$request_id '
                               'remote_addr=$remote_addr method=$request_method '
                               'uri=$uri status=$status request_time=$request_time '
                               'upstream_time=$upstream_response_time';
