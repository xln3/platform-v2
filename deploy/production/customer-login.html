<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>GEO Platform · 客户登录</title>
    <style>
      :root {
        color: #17211b;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        background: #f4f7f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 15%, rgb(23 97 58 / 14%), transparent 32%),
          radial-gradient(circle at 88% 82%, rgb(192 223 201 / 42%), transparent 30%), #f4f7f4;
      }

      .brand {
        position: fixed;
        top: 24px;
        left: 28px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #17211b;
        font-weight: 800;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 10px;
        background: #17613a;
        color: #fff;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 96px 20px 40px;
      }

      .card {
        width: min(100%, 440px);
        padding: 38px;
        border: 1px solid #d9e3dc;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 22px 70px rgb(26 59 38 / 12%);
      }

      .eyebrow {
        color: #17613a;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 10px;
        font-size: clamp(28px, 5vw, 38px);
      }

      .intro {
        margin: 0 0 24px;
        color: #637168;
        line-height: 1.7;
      }

      form {
        display: grid;
        gap: 9px;
      }

      label {
        margin-top: 8px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #b9c7be;
        border-radius: 9px;
        background: #fff;
        color: #17211b;
        font: inherit;
      }

      input:focus {
        border-color: #17613a;
        outline: 3px solid rgb(23 97 58 / 14%);
      }

      button {
        min-height: 46px;
        margin-top: 16px;
        padding: 10px 18px;
        border: 1px solid #17613a;
        border-radius: 9px;
        background: #17613a;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #1d7a47;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .message {
        min-height: 24px;
        margin: 8px 0 0;
        color: #a61b1b;
        font-weight: 700;
        line-height: 1.5;
      }

      .operations-link {
        display: block;
        min-height: 24px;
        margin-top: 20px;
        color: #4f6256;
        text-align: center;
      }

      .boundary-note {
        margin: 18px 0 0;
        padding-top: 16px;
        border-top: 1px solid #e7ece8;
        color: #758179;
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 560px) {
        .brand {
          top: 20px;
          left: 20px;
        }

        .card {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <a class="brand" href="/platform/customer/" aria-label="GEO 客户中心首页">
      <span class="brand-mark" aria-hidden="true">G</span>
      GEO 客户中心
    </a>
    <main>
      <section class="card" aria-labelledby="customer-login-title">
        <span class="eyebrow">Customer Portal</span>
        <h1 id="customer-login-title">客户登录</h1>
        <p class="intro">使用客户账号登录，成功后只进入已授权的客户页面。</p>
        <form id="customer-login-form">
          <label for="customer-login-email">邮箱</label>
          <input
            id="customer-login-email"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            maxlength="254"
            required
          />
          <label for="customer-login-password">密码</label>
          <input
            id="customer-login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          />
          <p id="customer-login-message" class="message" role="alert" aria-live="polite"></p>
          <button id="customer-login-submit" type="submit">登录客户中心</button>
        </form>
        <a class="operations-link" href="https://39.105.175.14:8788/platform/operations/login"
          >运营或管理员登录</a
        >
        <p class="boundary-note">账号密码只提交给同源认证接口，不写入浏览器存储。</p>
      </section>
    </main>
    <script>
      (() => {
        'use strict';

        const form = document.getElementById('customer-login-form');
        const emailInput = document.getElementById('customer-login-email');
        const passwordInput = document.getElementById('customer-login-password');
        const message = document.getElementById('customer-login-message');
        const submit = document.getElementById('customer-login-submit');
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/u;
        const projectPattern = /^prj_[A-Za-z0-9_-]{1,116}$/u;

        const customerDestination = () => {
          const project = new URLSearchParams(window.location.search).get('project');
          const destination = new URLSearchParams();
          if (project && projectPattern.test(project)) destination.set('project', project);
          destination.set('section', 'services');
          return `/platform/customer/?${destination.toString()}`;
        };

        const revokeUnexpectedSession = async () => {
          try {
            await fetch('/api/v2/identity/logout', {
              method: 'POST',
              credentials: 'same-origin',
            });
          } catch {
            // Navigation remains blocked even if best-effort revocation is unavailable.
          }
        };

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (submit.disabled) return;
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          if (
            email.length > 254 ||
            !emailPattern.test(email) ||
            password.length === 0 ||
            password.length > 256
          ) {
            message.textContent = '请输入有效邮箱和密码。';
            return;
          }

          submit.disabled = true;
          submit.textContent = '正在登录…';
          message.textContent = '';
          try {
            const response = await fetch('/api/v2/identity/login', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ email, password }),
            });
            passwordInput.value = '';
            if (response.status === 200) {
              const session = await response.json();
              const projectionValid =
                session &&
                typeof session === 'object' &&
                typeof session.tenant_pub_id === 'string' &&
                /^tnt_[A-Za-z0-9_-]{1,116}$/u.test(session.tenant_pub_id) &&
                typeof session.user_pub_id === 'string' &&
                /^usr_[A-Za-z0-9_-]{1,116}$/u.test(session.user_pub_id);
              if (!projectionValid || session.role !== 'customer') {
                await revokeUnexpectedSession();
                message.textContent = projectionValid
                  ? '此入口仅供客户账号使用，请通过下方链接进入运营或管理员登录。'
                  : '登录服务返回异常，请稍后重试。';
                return;
              }
              window.location.replace(customerDestination());
              return;
            }
            if (response.status === 401 || response.status === 422) {
              message.textContent = '邮箱或密码错误。';
            } else if (response.status === 429) {
              message.textContent = '尝试次数过多，请稍后再试。';
            } else {
              message.textContent = '登录服务暂不可用，请稍后重试。';
            }
          } catch {
            passwordInput.value = '';
            message.textContent = '登录服务暂不可用，请稍后重试。';
          } finally {
            submit.disabled = false;
            submit.textContent = '登录客户中心';
          }
        });
      })();
    </script>
  </body>
</html>
