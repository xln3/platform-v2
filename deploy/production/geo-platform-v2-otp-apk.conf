# Install as:
#   /etc/systemd/system/geo-platform-v2-api.service.d/otp-apk.conf
#
# The APK is an operator-managed binary under the persistent worktree runtime
# directory. It is intentionally ignored by Git, so immutable source snapshots
# do not contain it. Keep the API path pinned outside those snapshots.
[Service]
Environment=GEO_OTP_APK_PATH=/home/xln/geo-system/platform-v2/runtime/smsforwarder.apk
