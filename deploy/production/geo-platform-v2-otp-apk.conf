# Install as:
#   /etc/systemd/system/geo-platform-v2-api.service.d/otp-apk.conf
# Then run:
#   sudo systemctl daemon-reload
#   sudo systemctl restart geo-platform-v2-api.service
# and verify /api/v2/otp/apk-info reports integrity=verified before handing
# the configuration page to an operator. Never print token-bearing env files.
#
# OTP mutable state and the operator-managed APK live under the persistent
# worktree runtime directory. They are intentionally outside immutable source
# snapshots; every path must stay pinned here so a release switch cannot move
# writes or artifact reads into a read-only snapshot. The frozen public origin
# is explicit because nginx's $host omits the non-default :8443 port. SHA-256
# and signer identity are the reviewed 3.5.0.260224 asset; replace all three
# metadata values as one release operation when the APK moves.
[Service]
Environment=GEO_OTP_INBOX_DIR=/home/xln/geo-system/platform-v2/runtime/otp_inbox
Environment=GEO_OTP_REGISTRY_PATH=/home/xln/geo-system/platform-v2/runtime/otp_registered_numbers.json
Environment=GEO_OTP_APK_PATH=/home/xln/geo-system/platform-v2/runtime/smsforwarder.apk
Environment=GEO_OTP_APK_VERSION=3.5.0.260224
Environment=GEO_OTP_APK_SHA256=5dd85b9a6d2e954f8aa86713a0abb92f1a8b5e70ee5322706aab7cef1bcbb752
Environment=GEO_OTP_APK_SIGNER_SHA256=DA:6F:81:83:14:CF:0F:4B:6A:D6:90:94:A0:39:60:F9:C7:E5:3C:CF:3B:9F:3B:7A:FA:4B:33:48:AD:6B:47:FD
Environment=GEO_PUBLIC_BASE_URL=https://39.105.175.14:8443
