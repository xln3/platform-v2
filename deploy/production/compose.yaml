name: geo-platform-v2-production

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${GEO_PROD_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: geo_platform
    ports: ['127.0.0.1:55434:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geo -d geo_platform']
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: geo_analytics
      CLICKHOUSE_USER: geo
      CLICKHOUSE_PASSWORD: ${GEO_PROD_CLICKHOUSE_PASSWORD:?required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:18124:8123', '127.0.0.1:19010:9000']
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/001_s02_analytics.sql:/docker-entrypoint-initdb.d/001_s02_analytics.sql:ro
      - ../clickhouse/002_w2_source_audit.sql:/docker-entrypoint-initdb.d/002_w2_source_audit.sql:ro
      - ../clickhouse/003_w3_disparagement.sql:/docker-entrypoint-initdb.d/003_w3_disparagement.sql:ro
      - ./clickhouse-listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'clickhouse-client --user geo --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal-postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${GEO_PROD_TEMPORAL_POSTGRES_PASSWORD:?required}
    volumes: [temporal-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      temporal-postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${GEO_PROD_TEMPORAL_POSTGRES_PASSWORD:?required}
      POSTGRES_SEEDS: temporal-postgres
      # Temporal's internal gRPC clients must never inherit the host HTTP proxy.
      # grpc-go does not reliably honour CIDR entries in NO_PROXY, which can
      # otherwise route intra-container calls through the workstation proxy.
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      NO_PROXY: '*'
      http_proxy: ''
      https_proxy: ''
      no_proxy: '*'
    ports: ['127.0.0.1:17234:7233']
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 10s
      timeout: 8s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${GEO_PROD_MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${GEO_PROD_MINIO_ROOT_PASSWORD:?required}
    ports: ['127.0.0.1:19002:9000', '127.0.0.1:19003:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${GEO_PROD_REDIS_PASSWORD:?required}',
      ]
    ports: ['127.0.0.1:16381:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$GEO_PROD_REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      GEO_PROD_REDIS_PASSWORD: ${GEO_PROD_REDIS_PASSWORD:?required}

  vault:
    image: hashicorp/vault:2.0.3
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: ['server']
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_SKIP_VERIFY: 'true'
    ports: ['127.0.0.1:18200:8200']
    volumes:
      - vault-data:/vault/data
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - /etc/geo-platform-v2/vault-tls:/vault/tls:ro
    healthcheck:
      test: ['CMD', 'vault', 'status', '-tls-skip-verify']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    network_mode: host
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-data:/var/lib/otel

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    network_mode: host
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.path=/prometheus',
        '--web.listen-address=127.0.0.1:19090',
      ]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/business-alerts.yaml:/etc/prometheus/rules/business-alerts.yaml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      [
        '--path.procfs=/host/proc',
        '--path.sysfs=/host/sys',
        '--path.rootfs=/rootfs',
        '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)',
      ]
    ports: ['127.0.0.1:19100:9100']
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    network_mode: host
    command:
      [
        '--config.file=/etc/alertmanager/alertmanager.yml',
        '--storage.path=/alertmanager',
        '--web.listen-address=127.0.0.1:19093',
      ]
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    network_mode: host
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    network_mode: host
    command: ['run', '/etc/alloy/config.alloy', '--server.http.listen-addr=127.0.0.1:12345']
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy

  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 13000
      GF_SECURITY_ADMIN_USER: geo-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GEO_PROD_GRAFANA_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  clickhouse-data:
  temporal-postgres-data:
  minio-data:
  redis-data:
  otel-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
  vault-data:
