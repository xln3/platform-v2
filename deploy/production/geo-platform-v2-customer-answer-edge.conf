# The retired flat answer endpoint transfers bodies before the user selects an
# answer.  Keep it outside the customer edge's answer-library read surface.
location ~ "^/api/v2/customer-dashboard/projects/prj_[A-Za-z0-9_-]{1,116}/answers$" {
    return 404;
}

# Four-level answer library.  The browser remains same-origin, while this edge
# performs a second, certificate-pinned mTLS connection through the public IP.
location ~ "^/api/v2/customer-dashboard/projects/prj_[A-Za-z0-9_-]{1,116}/answer-library(?:/meta-queries/amq_[0-9a-f]{24}|/questions/aq_[0-9a-f]{24}/answers|/answers/ans_[A-Za-z0-9_-]{1,116})?$" {
    limit_except GET { deny all; }
    access_log /var/log/nginx/geo-customer-answer-edge.log geo_customer_answer;
    limit_req zone=geo_customer_answer_read burst=40 nodelay;
    limit_req_status 429;

    proxy_pass https://geo_customer_answer_backend_public;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host geo-answer-backend.local;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Role "";
    proxy_set_header X-Service-Token "";

    proxy_ssl_server_name on;
    proxy_ssl_name geo-answer-backend.local;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/geo-platform-v2/customer-read-pki/ca.crt;
    proxy_ssl_certificate /etc/geo-platform-v2/customer-read-pki/edge.crt;
    proxy_ssl_certificate_key /etc/geo-platform-v2/customer-read-pki/edge.key;
    proxy_ssl_session_reuse on;

    proxy_buffering on;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;

    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Vary;
    add_header Cache-Control "private, no-store" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Cookie, Authorization" always;
    add_header X-Content-Type-Options nosniff always;
}

# Citation/evidence relations use the same snapshot cutoff and transport policy.
location ~ "^/api/v2/analytics/answers/ans_[A-Za-z0-9_-]{1,116}/relations$" {
    limit_except GET { deny all; }
    access_log /var/log/nginx/geo-customer-answer-edge.log geo_customer_answer;
