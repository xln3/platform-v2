}
# Nginx's distribution MIME table does not consistently include ES module
# workers. Keep this override scoped to report studio on the backend listener.
# 注意：location 内自定义 add_header 会屏蔽 server 级安全头，故此处逐一补齐。
location ~ ^/platform/reports/(.+\.mjs)$ {
    alias /opt/geo-platform-v2/current/apps/report-studio/build/client/$1;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location /platform/intelligence/ {
    alias /opt/geo-platform-v2/current/apps/intelligence-web/build/client/;
    try_files $uri $uri/ /platform/intelligence/index.html;
}
location /platform/reports/ {
    alias /opt/geo-platform-v2/current/apps/report-studio/build/client/;
    try_files $uri $uri/ /platform/reports/index.html;
}
location /platform/intake-form/ {
    alias /opt/geo-platform-v2/current/apps/intake-form/build/client/;
    try_files $uri $uri/ /platform/intake-form/index.html;
}
