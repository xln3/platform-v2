# Include inside the authoritative GEO Platform V2 8443 server block.
location = /favicon.ico {
    access_log off;
    return 204;
}

location = /api/v2 {
    return 308 /api/v2/;
}
location /api/v2/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}

location = /platform {
    return 308 /platform/customer/;
}
location /platform/customer-terminal-extension/ {
    # Serve only an independently signed, immutable release. Development builds
    # replace packages/customer-terminal-extension/dist and must not affect production.
    alias /var/lib/geo-platform-v2/customer-terminal-extension/current/;
    try_files $uri =404;
    add_header Cache-Control "no-store";
}
# Nginx's distribution MIME table does not consistently include ES module
# workers. Keep this override scoped to the two applications that ship pdf.js.
location ~ ^/platform/customer/(.+\.mjs)$ {
    alias /home/xln/geo-system/platform-v2/apps/customer-web/build/client/$1;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/platform/reports/(.+\.mjs)$ {
    alias /home/xln/geo-system/platform-v2/apps/report-studio/build/client/$1;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /platform/customer/ {
    alias /home/xln/geo-system/platform-v2/apps/customer-web/build/client/;
    try_files $uri $uri/ /platform/customer/index.html;
}
location /platform/operations/ {
    alias /home/xln/geo-system/platform-v2/apps/operations-web/build/client/;
    try_files $uri $uri/ /platform/operations/index.html;
}
location /platform/intelligence/ {
    alias /home/xln/geo-system/platform-v2/apps/intelligence-web/build/client/;
    try_files $uri $uri/ /platform/intelligence/index.html;
}
location /platform/reports/ {
    alias /home/xln/geo-system/platform-v2/apps/report-studio/build/client/;
    try_files $uri $uri/ /platform/reports/index.html;
}
location /platform/intake-form/ {
    alias /home/xln/geo-system/platform-v2/apps/intake-form/build/client/;
    try_files $uri $uri/ /platform/intake-form/index.html;
}
