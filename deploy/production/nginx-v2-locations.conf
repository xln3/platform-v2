# Include inside the authoritative GEO Platform V2 8443 server block.
location = /favicon.ico {
    access_log off;
    return 204;
}

location = /api/v2 {
    return 308 /api/v2/;
}

# Sole production callback entry for the Feishu custom application.  Access
# logs are disabled because the request body is protocol material, and the bot
# performs signature, token, tenant/app, replay, and operator checks itself.
location = /api/v2/integrations/feishu/card-action {
    access_log off;
    client_max_body_size 256k;
    limit_req zone=geo_feishu_callback burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18092/callbacks/feishu/card-action;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

# OTP operator surface: exact locations keep it independent from the public
# /otp/push webhook. A dedicated access format logs $uri but never query args
# (latest includes a phone), tokens, or bodies; the API also emits a redacted
# authentication audit event. Secrets remain protected by the operator token
# gate and rate limits; there is deliberately no source-network allowlist.
location = /api/v2/otp/setup {
    access_log /var/log/nginx/geo-otp-operator-access.log geo_otp_operator;
    limit_req zone=geo_otp_operator_ui burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Role "";
    proxy_set_header X-Service-Token "";
    proxy_read_timeout 10s;
}

