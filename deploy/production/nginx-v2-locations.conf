# The include contains the narrow answer-library/relations public-hop routes
# and an explicit denial for the retired flat body list.
include /etc/nginx/snippets/geo-platform-v2-customer-answer-edge.conf;

location /api/v2/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 公网入口剥离客户端注入的身份头：合法 X-Service-Token 调用方（worker 侧
    # SessionGatewayClient）全部走 loopback:8020，不经 8443。
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Role "";
    proxy_set_header X-Service-Token "";
    proxy_read_timeout 300s;
}

# DOCX 上传端点：server 级 64k 放不下图文稿件，单独放宽（其余 API 仍 64k）。
location = /api/v2/posting/batches {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Role "";
    proxy_set_header X-Service-Token "";
    proxy_read_timeout 300s;
}

# 报价单目标词 XLSX 上传端点：文件内容上限由 API 再次钳制为 10 MiB；
# multipart 边界有少量额外开销，因此入口放宽到 11 MiB。
location = /api/v2/quotations/generate {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Role "";
    proxy_set_header X-Service-Token "";
    proxy_read_timeout 300s;
}

location = /platform {
    return 308 https://39.105.175.14:8787/platform/customer/;
}
