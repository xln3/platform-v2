# Public-network read backend.  It shares port 8443 with the browser-facing
# server but is selected only by mTLS SNI, so the existing public certificate
# and customer URL remain unchanged.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name geo-answer-backend.local;

    ssl_certificate /etc/geo-platform-v2/customer-read-pki/backend.crt;
    ssl_certificate_key /etc/geo-platform-v2/customer-read-pki/backend.key;
    ssl_client_certificate /etc/geo-platform-v2/customer-read-pki/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 64k;
    access_log /var/log/nginx/geo-customer-answer-backend.log geo_customer_answer;

    location = /api/v2/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Actor-Id "";
        proxy_set_header X-Actor-Role "";
        proxy_set_header X-Service-Token "";
        proxy_read_timeout 5s;
    }

    location ~ "^/api/v2/customer-dashboard/projects/prj_[A-Za-z0-9_-]{1,116}/answer-library(?:/meta-queries/amq_[0-9a-f]{24}|/questions/aq_[0-9a-f]{24}/answers|/answers/ans_[A-Za-z0-9_-]{1,116})?$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Actor-Id "";
        proxy_set_header X-Actor-Role "";
        proxy_set_header X-Service-Token "";
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location ~ "^/api/v2/analytics/answers/ans_[A-Za-z0-9_-]{1,116}/relations$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Actor-Id "";
        proxy_set_header X-Actor-Role "";
        proxy_set_header X-Service-Token "";
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
