# Callback abuse control is declared in http context; the exact location is in
# nginx-v2-locations.conf and additionally verifies Feishu signatures in-app.
limit_req_zone $binary_remote_addr zone=geo_feishu_callback:10m rate=10r/s;
# OTP operator UI/auth calls remain isolated from the public phone push path.
# Authentication is performed by the API's operator token gate.  The polling
# endpoint has its own budget because otp_wait legitimately calls it every two
# seconds; neither zone contains tokens or phone numbers as keys.
limit_req_zone $binary_remote_addr zone=geo_otp_operator_ui:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=geo_otp_operator_latest:10m rate=2r/s;

# Deliberately uses $uri (normalized path without query arguments), never
# $request/$args or credential headers. /otp/latest therefore cannot write a
# phone number to this access audit.
log_format geo_otp_operator '$time_iso8601 remote_addr=$remote_addr '
                            'method=$request_method uri=$uri status=$status '
                            'request_time=$request_time';

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # Publicly trusted, short-lived IP certificate managed by Certbot. The
    # certificate is renewed automatically; the deploy hook validates and
    # reloads Nginx only after a successful renewal.
    ssl_certificate     /etc/letsencrypt/live/39.105.175.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.105.175.14/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 缺省收紧到 64k；大请求体端点（DOCX 上传）在 include 内按 location 单独放宽。
    client_max_body_size 64k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        return 308 https://39.105.175.14:8787/platform/customer/;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8020/api/v2/health;
    }

    include /etc/nginx/snippets/geo-platform-v2.conf;

    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
