server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/geosys-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/geosys-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 308 /platform/customer/;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8020/api/v2/health;
    }

    include /etc/nginx/snippets/geo-platform-v2.conf;

    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
