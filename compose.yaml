name: geo-platform-v2
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_dev_only
      POSTGRES_DB: geo_platform
    ports: ['127.0.0.1:55433:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geo -d geo_platform']
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ['127.0.0.1:18123:8123', '127.0.0.1:19009:9000']
    environment:
      CLICKHOUSE_DB: geo_analytics
      CLICKHOUSE_USER: geo
      CLICKHOUSE_PASSWORD: geo_dev_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    # initdb 仅对空数据卷首跑生效（CI/新检出自动建 geo_analytics schema）；
    # 既有 dev 卷不会重放，schema 演进仍靠 deploy/clickhouse/*.sql 手动执行。
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'clickhouse-client',
          '--user',
          'geo',
          '--password',
          'geo_dev_only',
          '--query',
          'SELECT 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal-postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_dev_only
    volumes: [temporal-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_dev_only
      POSTGRES_SEEDS: temporal-postgres
      # Docker Desktop/daemon may inject the host HTTP proxy. Temporal advertises
      # container-private gRPC addresses, which must never be routed through it.
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
    ports: ['127.0.0.1:17233:7233']
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 10s
      timeout: 8s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.39.0
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:45102
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
    ports: ['127.0.0.1:18080:8080']
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '--spider', '-q', 'http://127.0.0.1:8080']
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: geo
      MINIO_ROOT_PASSWORD: geo_dev_only_password
    ports: ['127.0.0.1:19000:9000', '127.0.0.1:19001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:16380:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  clickhouse-data:
  temporal-postgres-data:
  minio-data:
  redis-data:
