name: platform-v2-ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: platform-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml up -d --wait
      - run: .venv/bin/alembic upgrade head
      # 隔离库分三类：head 业务/提交仓储、head 知识治理、s07_0002 兼容边界。
      # 选中车道后缺库或版本不符会 fail，不再静默 skip。
      - run: bash scripts/prepare_ci_test_databases.sh
      # 两条报告渲染路径都对非拉丁字符 fail-loud：PDF 回退链使用 Droid，
      # DOCX 图表和证据标注固定使用 Noto CJK。CI 干净镜像必须同时具备两者。
      - run: sudo apt-get install -y acl fonts-droid-fallback fonts-noto-cjk libreoffice-writer
      - run: .venv/bin/ruff check api domain workflows migrations tests tools scripts
      - run: .venv/bin/ruff format --check api domain workflows migrations tests tools scripts
      - run: .venv/bin/mypy api workflows domain
      - run: bash scripts/test_python.sh
      - run: .venv/bin/pytest -q -m slow --fail-on-skip
      - run: .venv/bin/pytest -q -m service_integration --fail-on-skip
      - run: .venv/bin/pytest -q -m isolated_postgres --fail-on-skip
        env:
          GEO_POSTGRES_DSN: postgresql+psycopg://geo:geo_dev_only@127.0.0.1:55433/geo_platform_s01_ci
          S01_BUSINESS_OVERVIEW_POSTGRES_DSN: postgresql://geo:geo_dev_only@127.0.0.1:55433/geo_platform_s01_ci
          COLLECTION_SUBMISSION_V2_TEST_DSN: postgresql://geo:geo_dev_only@127.0.0.1:55433/geo_platform_s01_ci
      - run: .venv/bin/pytest -q -m knowledge_postgres --fail-on-skip
        env:
          GEO_POSTGRES_DSN: postgresql+psycopg://geo:geo_dev_only@127.0.0.1:55433/geo_platform_knowledge_ci
          KNOWLEDGE_POSTGRES_DSN: postgresql://geo:geo_dev_only@127.0.0.1:55433/geo_platform_knowledge_ci
      - run: .venv/bin/pytest -q -m compat_postgres --fail-on-skip
        env:
          GEO_POSTGRES_DSN: postgresql+psycopg://geo:geo_dev_only@127.0.0.1:55433/geo_platform_quota_s07_ci
          COLLECTION_QUOTA_V2_TEST_DSN: postgresql://geo:geo_dev_only@127.0.0.1:55433/geo_platform_quota_s07_ci
          COLLECTION_QUOTA_V2_TEST_AS_WORKER: '1'
      - run: .venv/bin/pytest -q -m document_toolchain --fail-on-skip
      # 原 tools/test_*.py 不在 pytest testpaths；作为真实 Vault TLS/Transit 认证车道显式执行。
      - run: .venv/bin/python tools/test_vault_transit_integration.py
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vault-transit-integration
          path: test-results/vault-transit-real-integration.json
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml down -v

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm 必须先于 setup-node 可用：setup-node 的 cache: pnpm 解析依赖 pnpm 可执行文件，
      # 而 corepack enable 在其后才跑会导致 "Unable to locate executable file: pnpm"。
      # pnpm/action-setup 缺省读取根 package.json 的 packageManager 字段（pnpm@11.17.0）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # format:check 内含 .venv/bin/ruff format --check，而本 job 无 python 环境（.venv 不存在）；
      # ruff format 门由 python job 以相同 scope 显式执行，此处只跑 prettier 半边。
      - run: pnpm exec prettier --check .
      # React Router 的 build/lint/typecheck 都会改写同一个 .react-router/types 目录；
      # 放进一次并发 turbo 调用会互删临时类型文件并随机触发 TS6053。分阶段执行，
      # 各阶段内部仍保持跨 workspace 并行。
      - run: pnpm turbo run build
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test
      # 根 workspace 的浏览器运行时/DLP 单测不属于任何 turbo package，必须显式执行。
      - run: pnpm test:e2e-runtime-unit

  contract-and-release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: pnpm check:api
      # production-bundles 守卫检查的是构建产物 apps/*/build/client，CI 干净检出不带 build，
      # 必须先构建再守卫（守卫语义=生产 bundle 不夹带测试身份 fixture）。
      - run: pnpm turbo run build
      - run: pnpm check:production-bundles
      - run: pnpm check:production-routes
      - run: pnpm check:observability
      - run: pnpm check:e2e-artifacts
      - run: pnpm check:ci

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 同 typescript job：pnpm 必须先于 setup-node(cache: pnpm) 可用。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 视觉基线的 CJK 渲染环境对齐：基线机的 zh-cn 回退=Noto Sans/Serif CJK SC
      # （fonts-noto-cjk 自带 70-fonts-noto-cjk.conf 完成 zh-cn→SC 强绑定 prepend）。
      # CI 镜像默认无 Noto CJK，--with-deps 拉入的 wqy-zenhei/ipafont 接管回退，
      # 字宽/行高不同 → 全量视觉 diff（135 例 @ run 31428552379，含页面高度漂移）。
      # 装包即得同款 conf，无需额外 fontconfig；fc-match 输出留证。
      - run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-match "sans-serif:lang=zh-cn"
          fc-match "serif:lang=zh-cn"
      # 合同车道不打真实 API；两个 @live-api 用例由下方 live-api-e2e job 独立执行。
      - run: pnpm test:e2e:contract
        env:
          GEO_E2E_OUTPUT_DIR: test-results
          GEO_E2E_JSON_REPORT: test-results/e2e-results.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  live-api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml up -d --wait
      - run: .venv/bin/alembic upgrade head
      - run: >-
          .venv/bin/python scripts/prepare_live_api_e2e_dataset.py
          --output-dir test-results/live-api-datasets
      - name: Start and probe the real GEO API
        run: |
          mkdir -p test-results
          nohup .venv/bin/uvicorn geo_platform.main:app --app-dir api \
            --host 127.0.0.1 --port 45200 >test-results/live-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" >test-results/live-api.pid
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:45200/api/v2/health \
              >test-results/live-api-health.json; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              tail -100 test-results/live-api.log
              exit 1
            fi
            sleep 1
          done
          tail -100 test-results/live-api.log
          exit 1
        env:
          GEO_DATASETS_DIR: ${{ github.workspace }}/test-results/live-api-datasets
      # 两个 @live-api 用例只在 desktop 跑：这里验证真实 API/数据库边界，响应式布局由
      # contract 车道的视觉与可访问性用例负责，避免再乘三种视口。
      - run: pnpm test:e2e:live
        env:
          GEO_E2E_OUTPUT_DIR: test-results/e2e-live
          GEO_E2E_JSON_REPORT: test-results/e2e-live-results.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-api-e2e-failure-artifacts
          path: |
            test-results/e2e-live
            test-results/e2e-live-results.json
            test-results/live-api.log
            test-results/live-api-health.json
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: |
          if [[ -s test-results/live-api.pid ]]; then
            api_pid=$(<test-results/live-api.pid)
            if [[ "$api_pid" =~ ^[0-9]+$ ]]; then
              kill "$api_pid" 2>/dev/null || true
            fi
          fi
          docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml down -v

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml down -v
