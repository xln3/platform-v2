name: platform-v2-ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: platform-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml up -d --wait
      - run: .venv/bin/alembic upgrade head
      # 两条报告渲染路径都对非拉丁字符 fail-loud：PDF 回退链使用 Droid，
      # DOCX 图表和证据标注固定使用 Noto CJK。CI 干净镜像必须同时具备两者。
      - run: sudo apt-get install -y fonts-droid-fallback fonts-noto-cjk
      - run: .venv/bin/ruff check api domain workflows migrations tests tools scripts
      - run: .venv/bin/ruff format --check api domain workflows migrations tests tools scripts
      - run: .venv/bin/mypy api workflows domain
      - run: .venv/bin/pytest -q
      - if: failure()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml down -v

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm 必须先于 setup-node 可用：setup-node 的 cache: pnpm 解析依赖 pnpm 可执行文件，
      # 而 corepack enable 在其后才跑会导致 "Unable to locate executable file: pnpm"。
      # pnpm/action-setup 缺省读取根 package.json 的 packageManager 字段（pnpm@11.17.0）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # format:check 内含 .venv/bin/ruff format --check，而本 job 无 python 环境（.venv 不存在）；
      # ruff format 门由 python job 以相同 scope 显式执行，此处只跑 prettier 半边。
      - run: pnpm exec prettier --check .
      # React Router 的 build/lint/typecheck 都会改写同一个 .react-router/types 目录；
      # 放进一次并发 turbo 调用会互删临时类型文件并随机触发 TS6053。分阶段执行，
      # 各阶段内部仍保持跨 workspace 并行。
      - run: pnpm turbo run build
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test

  contract-and-release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: pnpm check:api
      # production-bundles 守卫检查的是构建产物 apps/*/build/client，CI 干净检出不带 build，
      # 必须先构建再守卫（守卫语义=生产 bundle 不夹带测试身份 fixture）。
      - run: pnpm turbo run build
      - run: pnpm check:production-bundles
      - run: pnpm check:production-routes
      - run: pnpm check:observability
      - run: pnpm check:ci

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 同 typescript job：pnpm 必须先于 setup-node(cache: pnpm) 可用。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 视觉基线的 CJK 渲染环境对齐：基线机的 zh-cn 回退=Noto Sans/Serif CJK SC
      # （fonts-noto-cjk 自带 70-fonts-noto-cjk.conf 完成 zh-cn→SC 强绑定 prepend）。
      # CI 镜像默认无 Noto CJK，--with-deps 拉入的 wqy-zenhei/ipafont 接管回退，
      # 字宽/行高不同 → 全量视觉 diff（135 例 @ run 31428552379，含页面高度漂移）。
      # 装包即得同款 conf，无需额外 fontconfig；fc-match 输出留证。
      - run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-match "sans-serif:lang=zh-cn"
          fc-match "serif:lang=zh-cn"
      # --grep-invert @live-api：两个打真实 API（identity/bootstrap 需可写库）的用例显式划入
      # live 车道，本 job 无 API 可打；排除是显式标记而非静默 skip，本地有 API 时可全量跑。
      - run: pnpm test:e2e --grep-invert @live-api
        env:
          GEO_E2E_OUTPUT_DIR: test-results
          GEO_E2E_JSON_REPORT: test-results/e2e-results.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f deploy/s02/compose.pgvector.yaml down -v
